    <script>
      (function () {
        try {
          var d = Object.getOwnPropertyDescriptor(window, 'fetch') ||
            (window.Window && Object.getOwnPropertyDescriptor(window.Window.prototype, 'fetch'));
          if (d && d.get && !d.set && d.configurable) {
            var currentFetch = window.fetch.bind(window);
            Object.defineProperty(window, 'fetch', {
              configurable: true,
              enumerable: true,
              get: function () { return currentFetch; },
              set: function (next) { if (typeof next === 'function') currentFetch = next; }
            });
          }
        } catch (_e) {}
        window.addEventListener('error', function (ev) {
          if (
            ev &&
            typeof ev.filename === 'string' &&
            ev.filename.indexOf('chrome-extension://') === 0 &&
            typeof ev.message === 'string' &&
            ev.message.indexOf('Cannot set property fetch') !== -1
          ) {
            ev.preventDefault();
            ev.stopImmediatePropagation();
          }
        }, true);
      })();
    </script>
